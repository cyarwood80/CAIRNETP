<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MODEL FLEET">
  <defs>
    <linearGradient id="fl-grad" x1="0.05" y1="0.1" x2="0.95" y2="0.9">
      <stop offset="0" stop-color="#e6f7ff"/><stop offset="0.45" stop-color="#13c2c2"/><stop offset="1" stop-color="#722ed1"/>
    </linearGradient>
    <linearGradient id="fl-node-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f7ff"/><stop offset="1" stop-color="#13c2c2"/>
    </linearGradient>
    <linearGradient id="fl-node-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#87e8de"/><stop offset="1" stop-color="#006d75"/>
    </linearGradient>
    <linearGradient id="fl-node-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3adf7"/><stop offset="1" stop-color="#531dab"/>
    </linearGradient>
    <linearGradient id="fl-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#69c0ff"/><stop offset="1" stop-color="#2f54eb"/>
    </linearGradient>
    <linearGradient id="fl-sheen" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="translate(256 256) scale(0.85) translate(-256 -256)">
    <!-- Interconnecting Synaptic Laser Rails -->
    <polygon points="256,120 376,330 136,330" fill="none" stroke="url(#fl-grad)" stroke-width="12" stroke-linejoin="round"/>
    <line x1="256" y1="120" x2="256" y2="256" stroke="url(#fl-grad)" stroke-width="8"/>
    <line x1="136" y1="330" x2="256" y2="256" stroke="url(#fl-grad)" stroke-width="8"/>
    <line x1="376" y1="330" x2="256" y2="256" stroke="url(#fl-grad)" stroke-width="8"/>

    <!-- Central Coordinator Nexus Core -->
    <circle cx="256" cy="256" r="44" fill="#0d1b33" stroke="url(#fl-grad)" stroke-width="8"/>
    <circle cx="256" cy="256" r="30" fill="url(#fl-core)"/>
    <ellipse cx="248" cy="246" rx="14" ry="8" fill="url(#fl-sheen)"/>

    <!-- Model Fleet Node 1 (Top / Leader Node) -->
    <circle cx="256" cy="120" r="36" fill="url(#fl-node-top)" stroke="#0b1222" stroke-width="6"/>
    <circle cx="256" cy="120" r="16" fill="#ffffff"/>

    <!-- Model Fleet Node 2 (Bottom-Left / Local Worker) -->
    <circle cx="136" cy="330" r="36" fill="url(#fl-node-left)" stroke="#0b1222" stroke-width="6"/>
    <circle cx="136" cy="330" r="16" fill="#ffffff"/>

    <!-- Model Fleet Node 3 (Bottom-Right / Accelerator Node) -->
    <circle cx="376" cy="330" r="36" fill="url(#fl-node-right)" stroke="#0b1222" stroke-width="6"/>
    <circle cx="376" cy="330" r="16" fill="#ffffff"/>
  </g>
</svg>