<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SETTINGS">
  <defs>
    <linearGradient id="st-grad" x1="0.05" y1="0.1" x2="0.95" y2="0.9">
      <stop offset="0" stop-color="#f0f5ff"/><stop offset="0.45" stop-color="#597ef7"/><stop offset="1" stop-color="#1d39c4"/>
    </linearGradient>
    <linearGradient id="st-sat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6e4ff"/><stop offset="0.5" stop-color="#85a5ff"/><stop offset="1" stop-color="#2f54eb"/>
    </linearGradient>
    <linearGradient id="st-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#69c0ff"/><stop offset="1" stop-color="#1d39c4"/>
    </linearGradient>
    <linearGradient id="st-sheen" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="translate(256 256) scale(0.85) translate(-256 -256)">
    <!-- Outer Calibration Dial Track -->
    <circle cx="236" cy="276" r="160" fill="none" stroke="#1d2a44" stroke-width="12"/>
    <circle cx="236" cy="276" r="140" fill="none" stroke="url(#st-grad)" stroke-width="4" stroke-dasharray="6 10"/>

    <!-- Primary Gear Teeth & Body -->
    <g transform="translate(236 276)">
      <circle cx="0" cy="0" r="100" fill="#0d182b" stroke="url(#st-grad)" stroke-width="14"/>
      <!-- Cog Teeth -->
      <rect x="-14" y="-120" width="28" height="24" rx="6" fill="url(#st-grad)"/>
      <rect x="-14" y="96" width="28" height="24" rx="6" fill="url(#st-grad)"/>
      <rect x="-120" y="-14" width="24" height="28" rx="6" fill="url(#st-grad)"/>
      <rect x="96" y="-14" width="24" height="28" rx="6" fill="url(#st-grad)"/>
      <g transform="rotate(45)">
        <rect x="-14" y="-120" width="28" height="24" rx="6" fill="url(#st-grad)"/>
        <rect x="-14" y="96" width="28" height="24" rx="6" fill="url(#st-grad)"/>
        <rect x="-120" y="-14" width="24" height="28" rx="6" fill="url(#st-grad)"/>
        <rect x="96" y="-14" width="24" height="28" rx="6" fill="url(#st-grad)"/>
      </g>
      <!-- Central Frosted Aperture Iris -->
      <circle cx="0" cy="0" r="54" fill="url(#st-core)" stroke="#0b1222" stroke-width="8"/>
      <ellipse cx="-12" cy="-14" rx="20" ry="10" fill="url(#st-sheen)"/>
      <circle cx="0" cy="0" r="16" fill="#0b1222"/>
    </g>

    <!-- Secondary Intermeshed Satellite Gear -->
    <g transform="translate(346 166)">
      <circle cx="0" cy="0" r="52" fill="#0d182b" stroke="url(#st-sat)" stroke-width="10"/>
      <rect x="-8" y="-66" width="16" height="16" rx="4" fill="url(#st-sat)"/>
      <rect x="-8" y="50" width="16" height="16" rx="4" fill="url(#st-sat)"/>
      <rect x="-66" y="-8" width="16" height="16" rx="4" fill="url(#st-sat)"/>
      <rect x="50" y="-8" width="16" height="16" rx="4" fill="url(#st-sat)"/>
      <g transform="rotate(45)">
        <rect x="-8" y="-66" width="16" height="16" rx="4" fill="url(#st-sat)"/>
        <rect x="-8" y="50" width="16" height="16" rx="4" fill="url(#st-sat)"/>
        <rect x="-66" y="-8" width="16" height="16" rx="4" fill="url(#st-sat)"/>
        <rect x="50" y="-8" width="16" height="16" rx="4" fill="url(#st-sat)"/>
      </g>
      <circle cx="0" cy="0" r="22" fill="url(#st-sat)" stroke="#0b1222" stroke-width="4"/>
      <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    </g>
  </g>
</svg>