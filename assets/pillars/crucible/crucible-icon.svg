<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CRUCIBLE">
  <defs>
    
    <linearGradient id="p-plate" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#111a2f"/>
      <stop offset="0.55" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="p-sheen" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p-shade" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#04070f" stop-opacity="0.66"/>
      <stop offset="1" stop-color="#04070f" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="cr-grad" x1="0.05" y1="0.1" x2="0.95" y2="0.9">
      <stop offset="0" stop-color="#fff0f6"/><stop offset="0.45" stop-color="#f759ab"/><stop offset="1" stop-color="#722ed1"/>
    </linearGradient>
    <linearGradient id="cr-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffadd2"/><stop offset="1" stop-color="#eb2f96"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="114" ry="114" fill="url(#p-plate)"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <polygon points="256,70 410,158 410,334 256,422 102,334 102,158" fill="none" stroke="#22314e" stroke-width="18" stroke-linejoin="round"/>
    <polygon points="256,115 368,180 368,308 256,373 144,308 144,180" fill="#0d1527" stroke="url(#cr-grad)" stroke-width="10" stroke-dasharray="18 10"/>

    <g transform="translate(256 244) rotate(45) translate(-256 -244)">
      <rect x="216" y="204" width="80" height="80" rx="18" fill="url(#cr-glow)" stroke="#ffffff" stroke-width="6"/>
      <rect x="222" y="210" width="36" height="36" rx="8" fill="url(#p-sheen)"/>
    </g>

    <circle cx="256" cy="70" r="14" fill="url(#cr-grad)"/>
    <circle cx="410" cy="158" r="14" fill="url(#cr-grad)"/>
    <circle cx="410" cy="334" r="14" fill="url(#cr-grad)"/>
    <circle cx="256" cy="422" r="14" fill="url(#cr-grad)"/>
    <circle cx="102" cy="334" r="14" fill="url(#cr-grad)"/>
    <circle cx="102" cy="158" r="14" fill="url(#cr-grad)"/>
  </g>
</svg>