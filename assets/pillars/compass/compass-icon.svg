<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="COMPASS">
  <defs>
    
    <linearGradient id="p-plate" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#111a2f"/>
      <stop offset="0.55" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="p-sheen" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p-shade" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#04070f" stop-opacity="0.66"/>
      <stop offset="1" stop-color="#04070f" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="cp-grad" x1="0.05" y1="0.1" x2="0.95" y2="0.9">
      <stop offset="0" stop-color="#f9f0ff"/><stop offset="0.45" stop-color="#b37feb"/><stop offset="1" stop-color="#531dab"/>
    </linearGradient>
    <linearGradient id="cp-needle-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3adf7"/>
    </linearGradient>
    <linearGradient id="cp-needle-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#722ed1"/><stop offset="1" stop-color="#391085"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="114" ry="114" fill="url(#p-plate)"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <circle cx="256" cy="256" r="165" fill="none" stroke="#1d263b" stroke-width="14"/>
    <circle cx="256" cy="256" r="135" fill="none" stroke="url(#cp-grad)" stroke-width="5" stroke-dasharray="10 14"/>

    <line x1="256" y1="80" x2="256" y2="105" stroke="url(#cp-grad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="256" y1="407" x2="256" y2="432" stroke="url(#cp-grad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="80" y1="256" x2="105" y2="256" stroke="url(#cp-grad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="407" y1="256" x2="432" y2="256" stroke="url(#cp-grad)" stroke-width="8" stroke-linecap="round"/>

    <g transform="rotate(45 256 256)">
      <polygon points="256,90 256,256 234,256" fill="url(#cp-needle-light)"/>
      <polygon points="256,90 278,256 256,256" fill="url(#cp-needle-dark)"/>
      <polygon points="256,422 256,256 234,256" fill="url(#cp-needle-dark)"/>
      <polygon points="256,422 278,256 256,256" fill="url(#cp-needle-light)"/>
      <polygon points="90,256 256,234 256,256" fill="url(#cp-needle-dark)"/>
      <polygon points="90,256 256,278 256,256" fill="url(#cp-needle-light)"/>
      <polygon points="422,256 256,234 256,256" fill="url(#cp-needle-light)"/>
      <polygon points="422,256 256,278 256,256" fill="url(#cp-needle-dark)"/>
    </g>

    <circle cx="256" cy="256" r="24" fill="url(#cp-grad)" stroke="#0b1222" stroke-width="6"/>
    <ellipse cx="250" cy="248" rx="10" ry="6" fill="url(#p-sheen)"/>
  </g>
</svg>