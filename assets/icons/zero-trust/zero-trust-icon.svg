<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Zero Trust by Design">
  <defs>
    <linearGradient id="zt-plate" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#111a2f"/>
      <stop offset="0.55" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="zt-sheen" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="zt-shade" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#04070f" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#04070f" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="zt-grad-outer" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#e6f4ff"/>
      <stop offset="0.35" stop-color="#69c0ff"/>
      <stop offset="0.7" stop-color="#1890ff"/>
      <stop offset="1" stop-color="#0958d9"/>
    </linearGradient>
    <linearGradient id="zt-grad-inner" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#e6fffb"/>
      <stop offset="0.4" stop-color="#36cfc9"/>
      <stop offset="1" stop-color="#006d75"/>
    </linearGradient>
    <linearGradient id="zt-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91d5ff"/>
      <stop offset="1" stop-color="#0050b3"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="114" ry="114" fill="url(#zt-plate)"/>
  <g transform="translate(256 256) scale(0.74) translate(-256 -256)">
    <!-- Outer Shield Perimeter -->
    <path d="M256 70 L390 120 C390 260, 340 370, 256 430 C172 370, 122 260, 122 120 Z" 
          fill="none" stroke="url(#zt-grad-outer)" stroke-width="20" stroke-linejoin="round"/>
    
    <!-- Intermediate Concentric Labyrinth Barrier -->
    <path d="M256 120 L352 156 C352 245, 316 328, 256 376 C196 328, 160 245, 160 156 Z" 
          fill="none" stroke="url(#zt-grad-outer)" stroke-width="14" stroke-linejoin="round" opacity="0.65"/>
    
    <!-- Inner Core Bastion Shield -->
    <path d="M256 170 L314 192 C314 246, 290 296, 256 326 C222 296, 198 246, 198 192 Z" 
          fill="url(#zt-grad-inner)" stroke="#0b1728" stroke-width="6"/>
    
    <!-- Central Cryptographic Keyhole Nexus -->
    <circle cx="256" cy="235" r="18" fill="#070d19" stroke="url(#zt-grad-outer)" stroke-width="4"/>
    <polygon points="250,238 262,238 266,275 246,275" fill="#070d19"/>
    
    <!-- Glass Highlights & Specular Reflections -->
    <path d="M256 86 L374 130 C374 210, 350 290, 256 350 Z" fill="url(#zt-sheen)" opacity="0.35"/>
    <ellipse cx="230" cy="140" rx="45" ry="18" fill="url(#zt-sheen)" transform="rotate(-15 230 140)"/>
  </g>
</svg>
