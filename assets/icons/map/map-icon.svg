<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NIST MAP">
  <defs>
    <linearGradient id="map-plate" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#111a2f"/>
      <stop offset="0.55" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="map-sheen" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="map-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f4ff"/>
      <stop offset="0.45" stop-color="#40a9ff"/>
      <stop offset="1" stop-color="#096dd9"/>
    </linearGradient>
    <linearGradient id="map-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6fffb"/>
      <stop offset="0.5" stop-color="#36cfc9"/>
      <stop offset="1" stop-color="#006d75"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="114" ry="114" fill="url(#map-plate)"/>
  <g transform="translate(256 256) scale(0.74) translate(-256 -256)">
    <!-- Folded Holographic Map Planes -->
    <polygon points="90,140 200,100 200,380 90,420" fill="#0d1f38" stroke="url(#map-blue)" stroke-width="8"/>
    <polygon points="200,100 310,140 310,420 200,380" fill="#0a192e" stroke="url(#map-cyan)" stroke-width="8"/>
    <polygon points="310,140 422,100 422,380 310,420" fill="#0d1f38" stroke="url(#map-blue)" stroke-width="8"/>

    <!-- Contour Elevation Lines -->
    <path d="M110 240 Q150 200 200 240 T310 240 T400 210" fill="none" stroke="url(#map-cyan)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <path d="M110 320 Q150 280 200 320 T310 320 T400 290" fill="none" stroke="url(#map-blue)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

    <!-- Map Radar Marker Pin Pinpoint -->
    <g transform="translate(256 210)">
      <circle cx="0" cy="0" r="32" fill="url(#map-blue)" stroke="#ffffff" stroke-width="4"/>
      <circle cx="0" cy="0" r="14" fill="#061220"/>
      <polygon points="-12,24 12,24 0,55" fill="url(#map-blue)"/>
    </g>

    <!-- Discovered Vector Nodes -->
    <circle cx="150" cy="190" r="10" fill="url(#map-cyan)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="360" cy="270" r="10" fill="url(#map-cyan)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="140" cy="350" r="8" fill="url(#map-blue)"/>
    <circle cx="370" cy="170" r="8" fill="url(#map-blue)"/>

    <!-- Glass Specular Reflection -->
    <ellipse cx="180" cy="110" rx="45" ry="15" fill="url(#map-sheen)" transform="rotate(-15 180 110)"/>
  </g>
</svg>
