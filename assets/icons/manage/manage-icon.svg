<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NIST MANAGE">
  <defs>
    <linearGradient id="mng-plate" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#111a2f"/>
      <stop offset="0.55" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="mng-sheen" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mng-magenta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd6e7"/>
      <stop offset="0.45" stop-color="#f759ab"/>
      <stop offset="1" stop-color="#c41d7f"/>
    </linearGradient>
    <linearGradient id="mng-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6fffb"/>
      <stop offset="0.5" stop-color="#13c2c2"/>
      <stop offset="1" stop-color="#006d75"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="114" ry="114" fill="url(#mng-plate)"/>
  <g transform="translate(256 256) scale(0.74) translate(-256 -256)">
    <!-- 3 Vertical Slider Rails -->
    <rect x="140" y="90" width="16" height="332" rx="8" fill="#0d1c33" stroke="url(#mng-magenta)" stroke-width="3"/>
    <rect x="248" y="90" width="16" height="332" rx="8" fill="#0d1c33" stroke="url(#mng-cyan)" stroke-width="3"/>
    <rect x="356" y="90" width="16" height="332" rx="8" fill="#0d1c33" stroke="url(#mng-magenta)" stroke-width="3"/>

    <!-- Track Active Fill Level Bars -->
    <rect x="142" y="270" width="12" height="150" rx="6" fill="url(#mng-magenta)"/>
    <rect x="250" y="160" width="12" height="260" rx="6" fill="url(#mng-cyan)"/>
    <rect x="358" y="220" width="12" height="200" rx="6" fill="url(#mng-magenta)"/>

    <!-- Slider 1 Handle (Left - Low/Mid) -->
    <g transform="translate(148 270)">
      <rect x="-36" y="-20" width="72" height="40" rx="10" fill="#091424" stroke="url(#mng-magenta)" stroke-width="6"/>
      <circle cx="0" cy="0" r="8" fill="url(#mng-magenta)"/>
      <line x1="-20" y1="0" x2="-10" y2="0" stroke="#ffffff" stroke-width="3"/>
      <line x1="10" y1="0" x2="20" y2="0" stroke="#ffffff" stroke-width="3"/>
    </g>

    <!-- Slider 2 Handle (Center - High) -->
    <g transform="translate(256 160)">
      <rect x="-36" y="-20" width="72" height="40" rx="10" fill="#091424" stroke="url(#mng-cyan)" stroke-width="6"/>
      <circle cx="0" cy="0" r="8" fill="url(#mng-cyan)"/>
      <line x1="-20" y1="0" x2="-10" y2="0" stroke="#ffffff" stroke-width="3"/>
      <line x1="10" y1="0" x2="20" y2="0" stroke="#ffffff" stroke-width="3"/>
    </g>

    <!-- Slider 3 Handle (Right - Mid) -->
    <g transform="translate(364 220)">
      <rect x="-36" y="-20" width="72" height="40" rx="10" fill="#091424" stroke="url(#mng-magenta)" stroke-width="6"/>
      <circle cx="0" cy="0" r="8" fill="url(#mng-magenta)"/>
      <line x1="-20" y1="0" x2="-10" y2="0" stroke="#ffffff" stroke-width="3"/>
      <line x1="10" y1="0" x2="20" y2="0" stroke="#ffffff" stroke-width="3"/>
    </g>

    <!-- Specular Reflection -->
    <ellipse cx="200" cy="100" rx="45" ry="16" fill="url(#mng-sheen)" transform="rotate(-15 200 100)"/>
  </g>
</svg>
